version: '3.8'

services:
  backend:
    build: ./back_end
    ports:
      - "5001:5000"
    volumes:
      - ./back_end:/app
      - ./data:/app/data
      - ./models:/app/models  # Volume pour charger les modèles entraînés
    environment:
      - DATABASE_URL=postgresql://postgres:0000@db:5432/books_db
    depends_on:
      - db
    networks:
      - bookfav-public
      - bookfav-private
    restart: unless-stopped

  frontend:
    build: ./front_end
    ports:
      - "5173:5173"
    volumes:
      - ./front_end:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5001/api
    depends_on:
      - backend
    networks:
      - bookfav-public
    restart: unless-stopped

  db:
    image: postgres:14
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=0000
      - POSTGRES_DB=books_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bookfav-private
    restart: unless-stopped

networks:
  bookfav-public:
    driver: bridge

  bookfav-private:
    driver: bridge

volumes:
  postgres-data:
